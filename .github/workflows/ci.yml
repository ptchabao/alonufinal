name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Verify no secret env file is committed
        run: |
          if git ls-files --error-unmatch .env.production > /dev/null 2>&1; then
            echo "::error::.env.production must not be committed. Untrack it (git rm --cached) and distribute it via CI secrets instead."
            exit 1
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      # Build de vérification uniquement : pas de release signée dans une CI publique.
      - run: flutter build apk --debug

  build-ios:
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
